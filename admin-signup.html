<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign Up — Ray's Collection</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="Ray's Collection logo">
      <span class="brand-text">Ray's <span>Collection</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
    </ul>
    <div class="nav-cta">
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </nav>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img src="images/logo.png" alt="Ray's Collection">
      <h1>Create Admin Account</h1>
      <p style="margin:0;">Only the shop owner's email can register</p>
    </div>

    <div class="form-msg" id="msg"></div>

    <form id="signup-form" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-gold btn-block">Create Account</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="admin-login.html">Sign in</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.classList.remove("show", "error", "success");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    const result = await rcSignUp(email, password, confirm);

    document.getElementById("password").value = "";
    document.getElementById("confirm").value = "";

    if (!result.ok) {
      msg.textContent = result.error;
      msg.classList.add("show", "error");
      return;
    }

    msg.textContent = "Account created. Redirecting to sign in…";
    msg.classList.add("show", "success");
    setTimeout(() => { window.location.href = "admin-login.html"; }, 1200);
  });
</script>
</body>
</html>
